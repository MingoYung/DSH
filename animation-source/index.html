<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>鲸启 · DSH Awakening — 第三版</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080d15;color:#e4ecf9;font-family:'Segoe UI','Microsoft YaHei UI',sans-serif}body{padding:clamp(18px,4vw,56px)}main{max-width:1360px;margin:auto}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:24px}.eyebrow{font-size:10px;letter-spacing:3px;color:#778faa;margin:0 0 11px}h1{font-size:26px;font-weight:450;letter-spacing:4px;margin:0}h1 span{font-size:12px;letter-spacing:3px;color:#8196b5;margin-left:16px}.edition{font:12px 'Bahnschrift',sans-serif;color:#6f88a8;letter-spacing:1px}.stage{position:relative;aspect-ratio:16/9;background:#000207;overflow:hidden;border-radius:4px;box-shadow:0 28px 100px #0006}canvas{width:100%;height:100%;display:block}.stage:fullscreen{width:100vw;height:100vh;aspect-ratio:auto;display:flex;align-items:center;justify-content:center;border-radius:0}.stage:fullscreen canvas{height:100%;width:100%;object-fit:contain}.exit-fullscreen{display:none;position:absolute;right:25px;top:24px}.stage:fullscreen:hover .exit-fullscreen,.exit-fullscreen:focus-visible{display:block}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #b6caff;outline-offset:4px}.controls{display:flex;align-items:center;flex-wrap:wrap;gap:17px;padding-top:23px}.primary{background:#dce8ff;color:#17263f;border:1px solid #b7cbee;padding:11px 22px;border-radius:30px;min-width:132px;font-size:13px}.secondary{background:#111e33a0;color:#a3b7d3;border:1px solid #2b3f5c;border-radius:30px;padding:10px 15px;font-size:12px;white-space:nowrap}.primary:hover{background:#fff}.secondary:hover{border-color:#6e8eb9}.timer{color:#96aac6;font:12px 'Bahnschrift',monospace;font-variant-numeric:tabular-nums;min-width:77px}.seek{flex:1;min-width:120px;height:3px;accent-color:#829ff1}.volume{width:60px;height:3px;accent-color:#829ff1}.notes{display:flex;justify-content:space-between;gap:30px;margin-top:19px;padding-top:19px;border-top:1px solid #1f2b3d;color:#6d85a4;font-size:12px;line-height:1.9}.notes p{margin:0}.notes strong{font-weight:400;color:#9aafcd}.notice{min-height:20px;color:#d9b68b;font-size:12px;margin-top:10px}.end{position:absolute;inset:0;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .4s}.end.visible{opacity:1;pointer-events:auto}.end button{background:#0d192ccc;color:#bfd0eb;border:1px solid #3f5574;border-radius:30px;padding:13px 25px;font-size:14px}@media(max-width:620px){body{padding:18px 12px}.head{gap:12px}h1{font-size:23px}h1 span{display:block;margin:8px 0 0;font-size:10px}.edition{font-size:10px;max-width:120px;text-align:right;line-height:1.8}.controls{gap:12px}.seek{order:10;flex-basis:100%}.volume{display:none}.primary{padding:11px 15px;min-width:117px}.secondary{padding:10px 12px}.timer{font-size:11px;min-width:65px}.notes{display:block}.notes p+p{margin-top:10px}}@media(prefers-reduced-motion:reduce){.end{transition:none}}
</style></head><body><main>
<header class="head"><div><p class="eyebrow">DSH / MOTION STUDY — REVISION 03</p><h1>鲸启<span>DSH AWAKENING</span></h1></div><span class="edition">22 SEC · 材质连续 / 逐点释放</span></header>
<section class="stage" id="player" aria-label="DSH 启动动画预览"><canvas id="stage" width="1920" height="1080" role="img" aria-label="光点聚成 DSH 官方鲸鱼，DeepSeek Harness 名称逐字归位，再化成星点和光带，接入角色苏醒及原声欢迎语。"></canvas><button class="secondary exit-fullscreen" id="exit-fullscreen">退出全屏</button><div class="end" id="end" inert aria-hidden="true"><button id="replay">重新播放 ↵</button></div></section>
<div class="controls"><button class="primary" id="play">播放第三版</button><span class="timer" id="timer">00:00 / 00:22</span><input class="seek" id="seek" type="range" min="0" max="22" step=".01" value="0" aria-label="预览时间"><button class="secondary" id="sound" aria-pressed="true">声音 开</button><input class="volume" id="volume" type="range" min="0" max="1" step=".05" value=".85" aria-label="音量"><button class="secondary" id="fullscreen">全屏观看</button></div><div id="notice" class="notice" role="status" aria-live="polite"></div>
<footer class="notes"><p><strong>鲸鱼逐点松开，汇入同一片星光。</strong><br>修订聚合与消散；文字、光带衔接和原声欢迎语沿用第二版。</p><p>角色原声欢迎语与原口型保留，未重新配音。<br>当前为动画概念预览，尚未接入实际 DSH 启动。</p></footer>
</main><audio id="audio" preload="auto" src="audio/awakening-master.wav"></audio><video id="tail" src="video/character-reveal.mp4" preload="auto" playsinline muted hidden></video><script src="assets/brand.js"></script><script src="animation.js"></script><script src="morph.js"></script><script>
'use strict';const $=id=>document.getElementById(id);const audio=$('audio'),video=$('tail');
const player=new DSHAwakening.Player($('stage'),{audio,video});window.previewPlayer=player;
let blocked=false;
function showEnd(visible){$('end').classList.toggle('visible',visible);$('end').inert=!visible;$('end').setAttribute('aria-hidden',String(!visible));}
function update(t){$('seek').value=t;$('timer').textContent=`00:${String(Math.floor(t)).padStart(2,'0')} / 00:22`;}
async function start(t){showEnd(false);$('notice').textContent='';await player.play(t);if(player.playing)$('play').textContent='暂停';}
$('play').onclick=()=>{if(player.playing){player.pause();$('play').textContent='继续播放';}else start(player.time>=21.99?0:player.time);};
$('replay').onclick=()=>start(0);
$('seek').oninput=async e=>{showEnd(false);await player.seek(Number(e.target.value));update(player.time);$('play').textContent='从此处播放';};
$('sound').onclick=async()=>{if(blocked){audio.currentTime=player.time;audio.muted=false;player.sound=true;try{await audio.play();blocked=false;player.audioClock=true;$('notice').textContent='';if(!player.playing)audio.pause();}catch{return;}}else{player.sound=!player.sound;audio.muted=!player.sound;}$('sound').textContent=`声音 ${player.sound?'开':'关'}`;$('sound').setAttribute('aria-pressed',String(player.sound));};
$('volume').oninput=e=>{player.volume=Number(e.target.value);audio.volume=player.volume;};
$('fullscreen').onclick=()=>$('player').requestFullscreen().catch(()=>{});$('exit-fullscreen').onclick=()=>document.exitFullscreen().catch(()=>{});
document.addEventListener('keydown',e=>{if(['INPUT','BUTTON'].includes(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();$('play').click();}if(e.code==='Enter'&&player.time>=21.99)start(0);});
player.on('frame',s=>update(s.time));player.on('complete',()=>{$('play').textContent='重新播放';showEnd(true);});player.on('audio',s=>{blocked=s.blocked;if(blocked){$('sound').textContent='启用声音';$('notice').textContent='浏览器暂未允许声音；点击“启用声音”重试。';}});
audio.addEventListener('error',()=>{$('notice').textContent='音轨加载失败；请保持 audio 文件夹和预览页放在一起。';});video.addEventListener('error',()=>{$('notice').textContent='角色视频加载失败；请保持 video 文件夹和预览页放在一起。';});
window.addEventListener('pagehide',()=>player.dispose(),{once:true});
window.renderAt=async time=>{const t=Number(time);if(t>=DSHAwakening.tailStart){if(video.readyState<2)await new Promise(r=>video.addEventListener('loadeddata',r,{once:true}));const to=Math.min(video.duration-.015,Math.max(0,t-DSHAwakening.tailStart));if(Math.abs(video.currentTime-to)>.003)await new Promise(r=>{video.addEventListener('seeked',r,{once:true});video.currentTime=to;});}return player.renderer.render(t,{video});};
player.renderer.render(new URLSearchParams(location.search).has('render')?0:6.7);
</script></body></html>
