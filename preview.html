<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鲸启 · 插件播放器预览</title><style>
html,body{margin:0;min-height:100%;background:#080d16;color:#dbe7f8;font-family:Segoe UI,Microsoft YaHei UI,sans-serif}main{max-width:600px;margin:12vh auto;padding:28px}h1{font-size:25px;letter-spacing:.15em;font-weight:500}p{font-size:13px;line-height:1.9;color:#91a5c2}button{font:14px inherit;border:1px solid #b9cef4;border-radius:24px;padding:12px 24px;background:#dce9ff;color:#182a45;cursor:pointer}button:disabled{opacity:.5}a{color:#9dbbfa;text-underline-offset:3px}#status{min-height:24px;margin-top:18px}
</style></head><body><main><h1>鲸启</h1><p>完整22秒，保留原声。画面按当前窗口宽高自适应，可在播放中自由调整窗口；按 Esc 或点“跳过”退出。</p><button id="play">完整预览</button><p id="status" role="status"></p><p>尾段角色影像与原声来自 dsh-boot-animation（MIT）。<br><a href="CREDITS.md" target="_blank" rel="noreferrer">查看来源、作者与许可</a></p></main>
<script src="runtime/scene/brand.js"></script><script src="runtime/scene/animation.js"></script><script src="runtime/scene/morph.js"></script><script src="runtime/scene/desktop-composition.js"></script><script src="runtime/scene/responsive-composition.js"></script><script src="runtime/scene/portrait-camera.js"></script><script src="runtime/stage.js"></script><script src="runtime/bootstrap.js"></script><script>
const settings={enabled:true,sound:true,volume:80,frequency:'startup',timeoutSeconds:45};
const api=window.__DSH_AWAKENING_INSTALL__({settings,sourceUrl:'media/boot.mp4',posterUrl:'media/poster.png',autostart:false});
document.getElementById('play').onclick=async function(){this.disabled=true;document.getElementById('status').textContent='';try{const result=await api.preview(settings);document.getElementById('status').textContent=result.reason==='complete'?'预览结束。':'已退出预览。';}catch{document.getElementById('status').textContent='预览未能完成，请检查媒体文件。';}finally{this.disabled=false;this.textContent='重新预览';}};
window.addEventListener('pagehide',()=>api.dispose(),{once:true});
</script></body></html>
