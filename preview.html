<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鲸启 · 原生画布预览</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#080d16;color:#dbe7fa;font-family:Segoe UI,Microsoft YaHei UI,sans-serif}body{padding:28px clamp(16px,4vw,60px)}main{max-width:1280px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin:0 0 20px}h1{font-size:23px;letter-spacing:.14em;font-weight:500;margin:0}.sub{font-size:11px;color:#849bbd;letter-spacing:.1em;margin-top:7px}select,button,input{font:inherit}select,button{color:#c6d8f4;background:#102039;border:1px solid #526f9744;border-radius:22px;padding:9px 15px;font-size:12px;cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #a2c7ff;outline-offset:3px}.primary{color:#14243d;background:#d8e7ff;border-color:#d8e7ff;min-width:104px}.stage{position:relative;overflow:hidden;background:#000207;width:100%;aspect-ratio:16/10;margin:0 auto;border-radius:3px;max-height:74vh}.stage video{position:absolute;inset:0;width:100%;height:100%;z-index:1;object-fit:contain}.stage:fullscreen{width:100vw!important;height:100vh!important;max-height:none;aspect-ratio:auto;border-radius:0}.controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:20px}.seek{flex:1;min-width:120px;accent-color:#82a5f2;height:3px}.time{font-size:12px;font-variant-numeric:tabular-nums;color:#8aa2c5}.volume{width:84px;accent-color:#82a5f2;height:3px}footer{margin-top:18px;padding-top:15px;border-top:1px solid #223047;color:#7f98bc;font-size:12px;line-height:1.8}#notice{color:#dbbd8a;min-height:18px;font-size:12px;margin-top:10px}@media(max-width:640px){body{padding:18px 12px}h1{font-size:20px}.sub{font-size:10px;letter-spacing:0}header{gap:8px}.controls{gap:10px}.seek{flex-basis:100%;order:9}.volume{display:none}select,button{padding:8px 12px}}
</style></head><body><main>
<header><div><h1>鲸启 <span style="font-size:12px;letter-spacing:.08em;color:#91a6c5">DSH AWAKENING</span></h1><div class="sub">原生方形画布 · 中央安全构图 · 22 秒原声</div></div><select id="ratio" aria-label="窗口比例"><option value="1.6">16:10</option><option value="1.3333333333">4:3</option><option value="1.7777777778">16:9</option><option value="2.3333333333">21:9</option><option value="0.75">3:4</option><option value="0.5625">9:16</option></select></header>
<section id="stage" class="stage" aria-label="动画画面"><video id="movie" playsinline preload="auto" poster="media/poster.png" src="media/boot.mp4"></video></section>
<div class="controls"><button id="play" class="primary">完整预览</button><button id="again">从头播放</button><span id="time" class="time">00:00 / 00:22</span><input id="seek" class="seek" type="range" min="0" max="22" step=".01" value="0" aria-label="播放位置"><button id="sound" aria-pressed="true">声音 开</button><input id="volume" class="volume" type="range" min="0" max="1" step=".01" value=".8" aria-label="音量"><button id="fullscreen">全屏</button></div>
<div id="notice" role="status" aria-live="polite"></div><footer>背景与星光延续到窗口边缘，中央文字、鲸鱼和人物按安全区取景。<br>这是动画构图预览；NEXT 最早默认加载页的接管需要单独的桌面启动支持。</footer>
</main><script src="runtime/stage.js"></script><script>
'use strict';const $=id=>document.getElementById(id),video=$('movie');video.volume=.8;
const stage=DSHAwakeningStage.mount({video,container:$('stage')});window.previewStage=stage;
const label=()=>{$('play').textContent=video.paused?'继续播放':'暂停';};
async function play(){try{await video.play();$('notice').textContent='';}catch{$('notice').textContent='请点击播放以启用画面和声音。';}label();}
$('play').onclick=()=>{if(video.paused){if(video.ended)video.currentTime=0;play();}else{video.pause();label();}};
$('again').onclick=()=>{video.currentTime=0;play();};
$('seek').oninput=event=>{video.currentTime=Number(event.target.value);};
video.ontimeupdate=()=>{$('seek').value=video.currentTime;$('time').textContent=`00:${String(Math.floor(video.currentTime)).padStart(2,'0')} / 00:22`;};video.onended=()=>{$('play').textContent='重新播放';};
video.onerror=()=>{$('notice').textContent='视频加载失败；请保留 media 文件夹与本页的相对位置。';};
$('sound').onclick=()=>{video.muted=!video.muted;$('sound').textContent=video.muted?'声音 关':'声音 开';$('sound').setAttribute('aria-pressed',String(!video.muted));};$('volume').oninput=event=>{video.volume=Number(event.target.value);};
function resize(){const ratio=Number($('ratio').value),space=Math.min(1280,document.querySelector('main').clientWidth),height=Math.min(innerHeight*.74,space/ratio);$('stage').style.width=Math.min(space,height*ratio)+'px';$('stage').style.aspectRatio=String(ratio);stage.refresh();}
$('ratio').onchange=resize;window.addEventListener('resize',resize);resize();
$('fullscreen').onclick=()=>$('stage').requestFullscreen().catch(()=>{});
window.addEventListener('pagehide',()=>{stage.dispose();video.pause();},{once:true});
</script></body></html>
